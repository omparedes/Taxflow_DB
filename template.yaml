AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Test Flow academico con registro y sesiones; datos de prueba
Parameters:
  ExecutionRoleArn:
    Type: String
    Default: arn:aws:iam::325875101955:role/LabRole
    AllowedValues:
      - arn:aws:iam::325875101955:role/LabRole
Resources:
  DemoTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: test-flow-dev-demo
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
  DemoApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: test-flow-dev-demo
      StageName: '$default'
      DefaultRouteSettings:
        ThrottlingBurstLimit: 5
        ThrottlingRateLimit: 2
  DemoLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/test-flow-dev-demo
      RetentionInDays: 7
  DemoFunction:
    Type: AWS::Serverless::Function
    DependsOn: DemoLogGroup
    Properties:
      FunctionName: test-flow-dev-demo
      CodeUri: src/
      Handler: app.handler
      Runtime: python3.13
      Architectures: [x86_64]
      MemorySize: 128
      Timeout: 10
      Role: !Ref ExecutionRoleArn
      Environment:
        Variables:
          TABLE_NAME: !Ref DemoTable
      Events:
        DemoRoutes:
          Type: HttpApi
          Properties:
            ApiId: !Ref DemoApi
            Path: /v1/{proxy+}
            Method: ANY
            PayloadFormatVersion: '2.0'
Outputs:
  ApiBaseUrl:
    Value: !Sub https://${DemoApi}.execute-api.${AWS::Region}.amazonaws.com
  TableName:
    Value: !Ref DemoTable
